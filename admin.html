function drawIM(){const e=$('#pvs');if(!e)return;e.innerHTML=IMS.map((u,k)=>`<div style="position:relative;width:84px"><img class="th" style="width:84px;height:84px;${k==0?'outline:2px solid #d4a017':''}" src="${u}" onclick="mainI(${k})"><button onclick="rmI(${k})" style="position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;border:0;background:#c00;color:#fff">×</button>${k==0?'<small style="position:absolute;bottom:22px;left:2px;background:#d4a017;padding:0 4px;border-radius:4px;font-size:10px">মূল</small>':''}<div style="font-size:12px;text-align:center;margin-top:3px;color:#6b4710;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${k+1}. ${E(TG.co[k]||'রং নেই')}</div></div>`).join('')||'<small style="color:#888">কোনো ছবি নেই</small>'}
const rmI=k=>{IMS.splice(k,1);drawIM()},mainI=k=>{IMS.unshift(IMS.splice(k,1)[0]);drawIM()};
async function pick(fl){for(const f of [...fl]){if(IMS.length>=5){alert('সর্বোচ্চ ৫টি ছবি দেওয়া যাবে।');break}
await new Promise(res=>{const i=new Image;i.onload=()=>{const s=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);IMS.push(c.toDataURL('image/jpeg',.7));res()};i.onerror=res;i.src=URL.createObjectURL(f)})}drawIM()}
async function sp(id){const pr=+g('p');
tgAdd('co');tgAdd('sz');const o={n:g('n'),c:g('c'),p:pr,o:+g('o')||pr,col:TG.co.slice(),sz:TG.sz.slice(),desc:$('#ds').value.trim(),sold:Math.max(0,+g('sd')||0),active:$('#ac').checked,img:IMS[0]||'',imgs:IMS};
if(IMS.join('').length>900000){alert('ছবিগুলো মোট অনেক বড় হয়ে গেছে। কয়েকটা ছবি কমান।');return}
if(!o.n||!pr||!o.col.length){alert('নাম, দাম আর অন্তত একটি রং দিন।');return}
try{id?await db.collection('products').doc(id).update(o):await db.collection('products').add({...o,t:Date.now()});closeM()}catch(e){alert('সেভ হয়নি: '+e.message)}}

/* রং/সাইজ: প্রতিটা আলাদা বাক্স */
let TG={co:[],sz:[]};
const tgH=(k,ph)=>`<div class="tgw"><div class="tg"><span id="tgb_${k}"></span><input class="tgi" id="tgi_${k}" placeholder="${ph}" oninput="tgIn('${k}',this)" onkeydown="if(event.key=='Enter'){event.preventDefault();tgAdd('${k}')}" onblur="tgAdd('${k}')"></div><button type="button" class="b g" onmousedown="event.preventDefault()" onclick="tgAdd('${k}');$('#tgi_${k}').focus()">+ যোগ</button></div>`;
function tgD(k){if(k=='co'&&typeof drawIM=='function')drawIM();const e=$('#tgb_'+k);if(e)e.innerHTML=TG[k].map((t,i)=>`<span class="tgb">${E(t)}<button type="button" onmousedown="event.preventDefault()" onclick="tgRm('${k}',${i})">×</button></span>`).join('')}
function tgPush(k,t){t=t.trim();if(t&&!TG[k].includes(t))TG[k].push(t)}
const SEP={co:/[,،.।]/,sz:/[,،]/};
function tgIn(k,el){if(SEP[k].test(el.value)){const a=el.value.split(SEP[k]);el.value=a.pop();a.forEach(t=>tgPush(k,t));tgD(k)}}
function tgAdd(k){const el=$('#tgi_'+k);if(!el)return;tgPush(k,el.value);el.value='';tgD(k)}
function tgRm(k,i){TG[k].splice(i,1);tgD(k)}

/* ভাউচার */
let VR=[];
const vTxt=v=>v.type=='ship'?'ফ্রি ডেলিভারি':v.type=='pct'?v.value+'% ছাড়':'৳'+v.value+' ছাড়';
const vSub=v=>(v.min?'সর্বনিম্ন কেনাকাটা ৳'+v.min:'কোনো সর্বনিম্ন সীমা নেই')+' · '+(v.exp?'মেয়াদ: '+v.exp:'মেয়াদ সীমা নেই')+(v.code?' · কোড: '+v.code:'');
function vouchers(){$('#v').innerHTML='<button class="b g" onclick="vf()">+ নতুন ভাউচার</button><div id="vl" style="margin-top:10px"></div>';
un=db.collection('vouchers').onSnapshot(s=>{VR=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.t||0)-(a.t||0));
$('#vl').innerHTML=VR.map(v=>`<div class="c"><div class="rw"><b>${E(vTxt(v))}</b><span class="tag">${v.active===false?'লুকানো':'চালু'}</span></div><small>${E(vSub(v))}</small>
<div class="bt"><button onclick="vf('${v.id}')">এডিট</button><button onclick="db.collection('vouchers').doc('${v.id}').update({active:${v.active===false}})">${v.active===false?'দেখান':'লুকান'}</button><button class="no" onclick="confirm('ভাউচারটি মুছবেন?')&&db.collection('vouchers').doc('${v.id}').delete()">মুছুন</button></div></div>`).join('')||'<p class="mid">এখনো কোনো ভাউচার নেই। "নতুন ভাউচার" চাপুন।</p>'},e=>$('#vl').textContent='লোড হয়নি: '+e.message+' (Firebase rules-এ vouchers যোগ করেছেন?)')}
function vf(id){const v=VR.find(x=>x.id==id)||{type:'amt'},o=(k,t)=>`<option value="${k}" ${v.type==k?'selected':''}>${t}</option>`;
M(`<h3>${id?'ভাউচার এডিট':'নতুন ভাউচার'}</h3>
<label>ধরন</label><select id="vt" onchange="vTg()">${o('amt','টাকা ছাড় (৳)')}${o('pct','শতাংশ ছাড় (%)')}${o('ship','ফ্রি ডেলিভারি')}</select>
<div id="vvw"><label id="vvl">ছাড়ের পরিমাণ</label><input id="vv" type="number" min="0" value="${v.value||''}"></div>
<label>সর্বনিম্ন কেনাকাটা (৳, না থাকলে ফাঁকা)</label><input id="vm" type="number" min="0" value="${v.min||''}">
<label>মেয়াদ শেষের তারিখ (না থাকলে ফাঁকা)</label><input id="ve" type="date" value="${E(v.exp||'')}">
<label>ভাউচার কোড (ঐচ্ছিক)</label><input id="vc" value="${E(v.code||'')}" placeholder="যেমন: MK100">
<label><input type="checkbox" id="va" ${v.active===false?'':'checked'}> সাইটে দেখান</label>
<div class="bt"><button class="b g" onclick="vs('${id||''}')">সেভ করুন</button><button class="b" onclick="closeM()">বাতিল</button></div>`);vTg()}
function vTg(){const t=$('#vt').value;$('#vvw').style.display=t=='ship'?'none':'block';$('#vvl').textContent=t=='pct'?'ছাড়ের শতাংশ (১ থেকে ১০০)':'ছাড়ের পরিমাণ (৳)'}
async function vs(id){const t=g('vt'),val=+g('vv')||0;
if(t!='ship'&&(val<=0||(t=='pct'&&val>100))){alert(t=='pct'?'১ থেকে ১০০-এর মধ্যে শতাংশ দিন।':'ছাড়ের পরিমাণ দিন।');return}
const o={type:t,value:t=='ship'?0:val,min:+g('vm')||0,exp:g('ve'),code:g('vc').toUpperCase(),active:$('#va').checked};
try{id?await db.collection('vouchers').doc(id).update(o):await db.collection('vouchers').add({...o,t:Date.now()});closeM()}catch(e){alert('সেভ হয়নি: '+e.message)}}

const d=await db.collection('settings').doc('site').get(),s={title:'Premium Quality Leather Products',sub:'মানিব্যাগ · জুতা · ব্যাগ · বেল্ট। স্টাইল, টেকসই আর ভরসা।',dhaka:80,out:130,...(d.exists?d.data():{})};

/* চ্যাট */
let CH={};
function chats(){$('#v').innerHTML='<div id="cl"></div>';
un=db.collection('chats').orderBy('lastAt','desc').onSnapshot(s=>{CH={};s.docs.forEach(d=>CH[d.id]=d.data());
$('#cl').innerHTML=s.docs.map(d=>{const c=d.data();return `<div class="c" style="cursor:pointer" onclick="chatO('${d.id}')"><div class="rw"><b>${E(c.name||'গ্রাহক')}${c.unreadAdmin?'<span class="dot"></span>':''}</b><small>${c.lastAt&&c.lastAt.toDate?E(c.lastAt.toDate().toLocaleString('bn-BD')):''}</small></div><small>${E(c.email)}</small><div style="margin-top:4px;color:#555">${E((c.lastMsg||'').slice(0,80))}</div></div>`}).join('')||'<p class="mid">এখনো কোনো চ্যাট আসেনি।</p>'},e=>$('#cl').textContent=e.message)}
function chatO(uid){const c=CH[uid]||{};cun&&cun();
M(`<div style="display:flex;flex-direction:column;height:80vh"><div class="rw" style="margin-bottom:8px"><b>${E(c.name||'গ্রাহক')}<br><small style="font-weight:400">${E(c.email)}</small></b><button class="b" onclick="closeM()">✕</button></div>
<div id="cm" style="flex:1;overflow:auto;background:#f7f4ef;border-radius:8px;padding:8px"></div>
<div class="rw" style="margin-top:8px"><input id="ci" placeholder="উত্তর লিখুন..." onkeydown="if(event.key=='Enter')sendA('${uid}')"><button class="b g" onclick="sendA('${uid}')">পাঠান</button></div></div>`);
const r=db.collection('chats').doc(uid);
cun=r.collection('messages').orderBy('createdAt').onSnapshot(s=>{const el=$('#cm');if(!el)return;
el.innerHTML=s.docs.map(d=>{const m=d.data();return `<div class="${m.from=='admin'?'ma':'mu'}">${E(m.text)}</div>`}).join('');el.scrollTop=el.scrollHeight;
r.set({unreadAdmin:false},{merge:true}).catch(()=>{})},e=>alert(e.message))}
async function sendA(uid){const t=g('ci');if(!t)return;$('#ci').value='';
try{const r=db.collection('chats').doc(uid),ts=firebase.firestore.FieldValue.serverTimestamp();
await r.collection('messages').add({text:t,from:'admin',createdAt:ts});
await r.set({lastMsg:'আপনি: '+t,lastAt:ts,unreadAdmin:false},{merge:true})}catch(e){alert('পাঠানো হয়নি: '+e.message)}}

/* ===== নোটিফিকেশন, ইনস্টল ও নতুন অর্ডারের সতর্কবার্তা ===== */
function swReady(r){return new Promise(res=>{const w=r.installing||r.waiting||r.active;if(!w||w.state=='activated')return res(r);w.addEventListener('statechange',()=>{if(w.state=='activated')res(r)})})}
async function regSW(){if(SWR||!('serviceWorker' in navigator))return SWR;try{const r=await navigator.serviceWorker.register('admin-sw.js',{scope:'/admin.html'});SWR=await swReady(r)}catch(e){console.error(e)}return SWR}
async function saveTok(){if(!VAPID||!SWR||!auth.currentUser)return null;try{if(!firebase.messaging.isSupported())return null;const t=await firebase.messaging().getToken({vapidKey:VAPID,serviceWorkerRegistration:SWR});if(t){await db.collection('adminTokens').doc(t).set({t:Date.now(),email:auth.currentUser.email,ua:navigator.userAgent.slice(0,100)})}return t}catch(e){console.error(e);throw e}}
function nbtn(){const b=$('#nb');if(!b)return;if(!('Notification' in window)){b.style.display='none';return}
const p=Notification.permission;b.style.display='inline-block';b.textContent=p=='granted'?'🔔 চালু':p=='denied'?'🔕 বন্ধ':'🔔 নোটিফিকেশন চালু করুন';b.onclick=enableNotif}
async function enableNotif(){if(!('Notification' in window)){alert('এই ব্রাউজারে নোটিফিকেশন চলে না।');return}
if(Notification.permission=='denied'){alert('নোটিফিকেশন বন্ধ করা আছে। ফোনের সেটিংস থেকে এই সাইট/অ্যাপের নোটিফিকেশন অনুমতি দিন।');return}
const p=await Notification.requestPermission();nbtn();if(p!='granted')return;
await regSW();
if(!VAPID){alert('নোটিফিকেশন চালু হয়েছে (অ্যাপ খোলা থাকলে অর্ডার আসামাত্র জানাবে)। অ্যাপ বন্ধ থাকলেও জানাতে VAPID কী বসাতে হবে।');return}
try{await saveTok();toast2('🔔 নোটিফিকেশন চালু হয়েছে')}catch(e){alert('নোটিফিকেশন চালু করা যায়নি: '+e.message)}}
async function initPush(){await regSW();nbtn();if(Notification.permission=='granted'){try{await saveTok()}catch(e){}}}
function beep(){try{const C=window.AudioContext||window.webkitAudioContext,a=window._ac||(window._ac=new C());a.resume&&a.resume();[0,.18,.36].forEach((t,i)=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=i==2?1180:880;g.gain.setValueAtTime(.0001,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.35,a.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t+.16);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+.17)})}catch(e){}}
function toast2(h,btn){const t=$('#nt');t.innerHTML=h+(btn||'');t.style.display='flex';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',btn?9000:2200)}
function setBadge(n){const b=$('#t1');if(b)b.innerHTML='অর্ডার'+(n?`<span class="nb">${n}</span>`:'')}
function newAlert(id,o){beep();try{navigator.vibrate&&navigator.vibrate([200,100,200,100,300])}catch(e){}
const n=Array.isArray(o.items)?o.items.reduce((s,i)=>s+(+i.qty||1),0):0;
toast2(`<span>🛍️ নতুন অর্ডার! ${E(o.name||'')} · ৳${E(o.total||0)}</span>`,'<button onclick="flt=\'নতুন\';tab(1);$(\'#nt\').style.display=\'none\'">দেখুন</button>');
if(document.hidden&&'Notification' in window&&Notification.permission=='granted'&&SWR){SWR.showNotification('নতুন অর্ডার এসেছে!',{body:(o.name||'গ্রাহক')+' · ৳'+(o.total||0)+(n?' · '+n+'টি পণ্য':''),icon:'/icon-192.png',badge:'/icon-192.png',tag:'order-'+id,renotify:true,vibrate:[200,100,200,100,300],data:{url:'/admin.html'}}).catch(()=>{})}}
function watchOrders(){ow&&ow();owInit=false;
ow=db.collection('orders').orderBy('createdAt','desc').limit(50).onSnapshot(s=>{
setBadge(s.docs.filter(d=>(d.data().status||'নতুন')=='নতুন').length);
if(owInit){s.docChanges().forEach(c=>{if(c.type!='added')return;const o=c.doc.data(),t=o.createdAt&&o.createdAt.toDate?o.createdAt.toDate().getTime():Date.now();if(Date.now()-t<120000)newAlert(c.doc.id,o)})}
owInit=true},e=>console.error(e))}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;$('#ib').style.display='inline-block'});
$('#ib').onclick=async()=>{if(!dip)return;dip.prompt();await dip.userChoice;dip=null;$('#ib').style.display='none'};
addEventListener('appinstalled',()=>{$('#ib').style.display='none'});
